<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f1419">
  <title>A股智能推荐</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #3b82f6;
      --accent2: #10b981;
      --warn: #f59e0b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2d3a4f;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px 16px calc(24px + var(--safe-b));
      -webkit-font-smoothing: antialiased;
    }
    .header {
      text-align: center;
      padding: 16px 0 8px;
    }
    .header h1 { font-size: 1.35rem; font-weight: 700; }
    .user-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 14px; margin: 10px 0;
      font-size: 0.78rem; color: var(--muted);
    }
    .user-bar strong { color: var(--text); }
    .link-btn { background: none; border: none; color: var(--accent); font-size: 0.78rem; }
    .badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--accent2);
      background: rgba(16,185,129,.12);
      padding: 4px 10px;
      border-radius: 20px;
    }
    .tip {
      background: linear-gradient(135deg, #1e3a5f, #1a2332);
      border: 1px solid var(--warn);
      border-radius: 14px;
      padding: 14px;
      margin: 14px 0;
      font-size: 0.88rem;
      color: #fcd34d;
      line-height: 1.55;
    }
    .tip strong { display: block; margin-bottom: 6px; font-size: 0.92rem; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 16px 0;
    }
    .btn {
      width: 100%;
      padding: 18px 20px;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active { opacity: 0.85; transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .status {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .status-label { font-size: 0.72rem; color: var(--muted); }
    .status-msg { font-size: 0.92rem; margin-top: 6px; min-height: 1.4em; line-height: 1.5; }
    .progress-box {
      max-height: 100px;
      overflow-y: auto;
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .results { display: flex; flex-direction: column; gap: 12px; }
    .result-meta {
      background: var(--card);
      border: 1px solid var(--accent2);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .result-meta strong { color: var(--accent2); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .card-rank {
      background: var(--accent);
      color: #fff;
      min-width: 32px; height: 32px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; font-weight: 700;
    }
    .card-name { font-size: 1.2rem; font-weight: 700; }
    .card-code { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }
    .metric-val { font-size: 1.05rem; font-weight: 700; color: var(--accent2); }
    .metric-lbl { font-size: 0.68rem; color: var(--muted); margin-top: 4px; }
    .detail { font-size: 0.82rem; color: var(--muted); line-height: 1.65; }
    .detail span { color: var(--text); }
    .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 0.9rem; }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.65;
    }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>A股智能推荐</h1>
    <div class="badge">手机版 · 云端运行</div>
  </div>

  {% if user %}
  <div class="user-bar">
    <span><strong>{{ user.username }}</strong>
      {% if user.expires_at %} · {{ user.expires_at[:10] }}到期{% endif %}
    </span>
    <button class="link-btn" onclick="logout()">退出</button>
  </div>
  {% endif %}

  <div class="tip">
    <strong>操作建议</strong>
    {{ trade_tip }}。{{ screen_tip }}。
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnStart" onclick="startScreen()">开始检索推荐</button>
    <button class="btn btn-secondary" id="btnNet" onclick="testNet()">测试连接</button>
  </div>

  <div class="status">
    <div class="status-label">状态</div>
    <div class="status-msg" id="statusMsg">就绪，点击开始检索</div>
    <div class="progress-box" id="progressBox"></div>
  </div>

  <div class="results" id="results"></div>

  <div class="footer">
    数据来源：东方财富 · 仅供学习参考，不构成投资建议<br>
    可将本页「添加到主屏幕」，像 App 一样打开<br>
    <span style="opacity:.6">版本 {{ app_version }} · 股价≥10元</span>
  </div>

  <script>
    let polling = null;

    function authRedirect(r, d) {
      if (r.status === 401 || (d && d.auth === false)) {
        location.href = '/login';
        return true;
      }
      return false;
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      location.href = '/login';
    }

    function setStatus(msg, loading) {
      document.getElementById('statusMsg').innerHTML =
        loading ? '<span class="spinner"></span>' + msg : msg;
    }

    function renderResults(data) {
      const box = document.getElementById('results');
      if (!data || !data.picks || data.picks.length === 0) {
        const elapsed = data && data.elapsed_text
          ? `<div class="result-meta">本次检索用时：<strong>${data.elapsed_text}</strong></div>` : '';
        box.innerHTML = elapsed + '<div class="empty">暂无推荐，请稍后重试</div>';
        return;
      }
      const meta = `<div class="result-meta">用时 <strong>${data.elapsed_text || '-'}</strong> · ${data.finished_at || ''} · ${data.count} 只</div>`;
      box.innerHTML = meta + data.picks.map((s, i) => `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-name">${s.name}</div>
              <div class="card-code">${s.code}</div>
            </div>
            <div class="card-rank">#${i + 1}</div>
          </div>
          <div class="metrics">
            <div class="metric"><div class="metric-val">${s.price.toFixed(2)}</div><div class="metric-lbl">最新价</div></div>
            <div class="metric"><div class="metric-val">${s.speed.toFixed(2)}%</div><div class="metric-lbl">涨速</div></div>
            <div class="metric"><div class="metric-val">${s.change_pct.toFixed(2)}%</div><div class="metric-lbl">涨幅</div></div>
          </div>
          <div class="detail">
            趋势：<span>${s.trend_detail}</span>（${s.trend_score.toFixed(0)}分）<br>
            超大单：<span>${s.super_large_flow_text}</span><br>
            大单：<span>${s.large_flow_text}</span><br>
            综合：<span>${s.total_score.toFixed(1)}</span>
          </div>
        </div>`).join('');
    }

    function renderProgress(items) {
      const box = document.getElementById('progressBox');
      if (!items || !items.length) { box.innerHTML = ''; return; }
      box.innerHTML = items.slice(-8).map(p => `<div>${p.text || p}</div>`).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function poll() {
      try {
        const r = await fetch('/api/status');
        const s = await r.json();
        if (authRedirect(r, s)) return;
        setStatus(s.message, s.running);
        renderProgress(s.progress);
        if (s.result) renderResults(s.result);
        if (!s.running) {
          clearInterval(polling);
          polling = null;
          document.getElementById('btnStart').disabled = false;
        }
      } catch (e) {
        setStatus('网络中断，请刷新重试');
      }
    }

    async function startScreen() {
      document.getElementById('btnStart').disabled = true;
      document.getElementById('results').innerHTML = '';
      setStatus('正在启动...', true);
      try {
        const r = await fetch('/api/start', { method: 'POST' });
        const d = await r.json();
        if (authRedirect(r, d)) return;
        if (!d.ok) {
          setStatus(d.msg);
          document.getElementById('btnStart').disabled = false;
          return;
        }
        if (polling) clearInterval(polling);
        polling = setInterval(poll, 1200);
        poll();
      } catch (e) {
        setStatus('启动失败，请检查网络');
        document.getElementById('btnStart').disabled = false;
      }
    }

    async function testNet() {
      document.getElementById('btnNet').disabled = true;
      setStatus('测试连接...', true);
      try {
        const r = await fetch('/api/network');
        const d = await r.json();
        if (authRedirect(r, d)) return;
        setStatus(d.ok ? '✓ ' + d.msg : '✗ ' + d.msg);
      } catch (e) {
        setStatus('连接失败');
      }
      document.getElementById('btnNet').disabled = false;
    }
  </script>
</body>
</html>
